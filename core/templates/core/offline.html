<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102D46">
    <title>Sin conexión · {{ PLATFORM_NAME }}</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1F2937; }
        .card { text-align: center; padding: 2rem; max-width: 360px; }
        .icon { width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%; background: #102D46; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
        p { color: #6B7280; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.25rem; }
        button { background: #102D46; color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #284E6B; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con {{ PLATFORM_NAME }}. Revisa tu conexión e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>

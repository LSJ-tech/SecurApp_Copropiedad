{% extends "core/base.html" %}
{% load static %}
{% block titulo %}Revisa tu correo{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <img src="{% static 'core/logo.svg' %}" width="48" height="48" alt="" class="mb-3">
                <h1 class="h4 mb-3">Revisa tu correo</h1>
                <p class="text-muted">Si ese correo está registrado, te llegará un link para elegir una contraseña nueva. Revisa también Spam/Promociones.</p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

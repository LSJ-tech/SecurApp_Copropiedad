{% extends "core/base.html" %}
{% load static %}
{% block titulo %}Contraseña actualizada{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <img src="{% static 'core/logo.svg' %}" width="48" height="48" alt="" class="mb-3">
                <h1 class="h4 mb-3">¡Listo!</h1>
                <p class="text-muted">Tu contraseña se actualizó. Ya puedes iniciar sesión con la nueva.</p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-2">Iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

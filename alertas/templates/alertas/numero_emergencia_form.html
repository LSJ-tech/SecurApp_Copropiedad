{% extends "core/base.html" %}
{% block titulo %}Agregar número de emergencia{% endblock %}
{% block contenido %}
<h1 class="h4 mb-3">Agregar número de emergencia</h1>
<form method="post" class="col-md-5">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'numeros-emergencia' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}

services:
  - type: web
    name: securapp-copropiedad
    env: python
    plan: free  # Pasar a un plan pago cuando el servicio esté listo para producción real.
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # El subdominio .onrender.com está desactivado a propósito (solo se usa
      # el dominio propio) -- no hace falta listarlo acá.
      - key: DJANGO_ALLOWED_HOSTS
        value: securapp.devquad.cl,condofy.devquad.cl
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://securapp.devquad.cl,https://condofy.devquad.cl
      - key: DATABASE_URL
        sync: false  # Supabase (session pooler) -- se setea a mano en el dashboard de Render, ver README
      # Configurar antes de aceptar clientes reales (ver README):
      # RESEND_API_KEY, DEFAULT_FROM_EMAIL (sin RESEND_API_KEY los correos solo se imprimen en logs)
      # MERCADOPAGO_ACCESS_TOKEN (sin ella no aparece el botón de pago en línea)

# El respaldo del webhook de Mercado Pago (re-consulta periódica de
# suscripciones/donaciones activas, ver pagos/views.py) ya NO corre como
# cron job de Render -- Render no tiene plan gratis para el tipo "cron"
# (esto llevaba 5 días con el sync del Blueprint roto por esa razón, sin
# que nadie lo notara porque el servicio web sigue desplegando normal vía
# push directo). Se movió a .github/workflows/sincronizar_suscripciones.yml
# (GitHub Actions, gratis, corre cada 4 horas conectándose directo a
# Supabase) -- requiere los secrets DATABASE_URL y MERCADOPAGO_ACCESS_TOKEN
# configurados en GitHub (Settings → Secrets and variables → Actions).

# El bloque "databases:" que autoprovisionaba el Postgres de Render se
# retiró a propósito tras migrar los datos reales a Supabase (ver
# scripts/migrar_a_supabase.py). La base vieja de Render se deja viva unos
# días como red de seguridad para un rollback instantáneo -- no se borra
# acá, se borra a mano desde el dashboard cuando quede confirmado que
# Supabase funciona bien en producción.

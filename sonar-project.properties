sonar.organization=lsj-tech
sonar.projectKey=LSJ-tech_Condofy

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# app_movil/ (Expo/TypeScript, Fase 2 de Mi Barrio+) tiene su propio suite
# de Jest -- sin esto Sonar no tenía ningún dato de cobertura para esos
# archivos y contaba cada línea nueva como 0% cubierta (new_coverage cayó
# a 58.3% con el gate en ERROR) aunque el suite real cubre ~88%. El CI
# corre `npx jest --coverage` en app_movil/ antes del scan (ver
# .github/workflows/sonarcloud.yml) y deja el reporte en esta ruta.
sonar.javascript.lcov.reportPaths=app_movil/coverage/lcov.info

# Los tests viven junto al código que prueban (tests.py/test_*.py dentro de
# cada app), no en una carpeta aparte -- sin esto Sonar los trata como
# código de producción más. Como .coveragerc los omite a propósito de la
# medición (no tiene sentido medir "coverage de los tests"), Sonar los veía
# como líneas nuevas con 0% de cobertura y hundía new_coverage (bajó de
# 50.9% a 44.1% justo al agregar ~750 líneas de tests nuevos). Esto los
# reclasifica como tests, no como fuente a cubrir.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx

# Migraciones y comandos de management son generados/casi nunca se corren
# bajo test -- sin esto, su coverage en 0% distorsiona el número total sin
# aportar información real sobre qué código de la app está probado.
#
# scripts/** son herramientas puntuales de un solo uso (migrar a Supabase,
# consolidar condominios, regenerar íconos) -- se corren a mano una vez
# contra producción/el entorno local, nunca se importan desde la app ni
# desde manage.py test, igual que management/commands/ no tiene sentido
# medirles coverage.
#
# *.js (vanilla JS de los templates Django, y app_movil/scripts/ -- un
# script de Expo de un solo uso) no tiene test runner sobre esos archivos
# puntuales ni tiene sentido medirle cobertura: el JS de los templates se
# prueba vía los tests de Django que renderizan el template y confirman
# que el script queda incluido (ver core/tests.py), y el script de Expo
# nunca se importa desde la app. El código real de app_movil/ es
# TypeScript (.ts/.tsx), no entra en este exclude, y sí tiene cobertura
# real vía Jest (ver sonar.javascript.lcov.reportPaths arriba).
sonar.coverage.exclusions=**/migrations/**,**/management/commands/**,manage.py,config/wsgi.py,config/asgi.py,scripts/**,**/*.js

# app_movil/scripts/reset-project.js es el script de un solo uso que
# genera `create-expo-app` (mover a /example los archivos de ejemplo) --
# nunca se importa desde la app, nunca corre en producción, no lo
# escribimos nosotros. Se excluye del análisis entero (no solo de
# coverage) por el mismo motivo que scripts/** de Django: no tiene
# sentido invertir en refactorizar boilerplate que no es parte del
# producto.
sonar.exclusions=app_movil/scripts/reset-project.js

# S2699 ("Tests should include assertions") da falso positivo sistemático
# en todo el suite de Jest de app_movil/ -- la regla solo reconoce
# expect()/assert() literal, pero Testing Library (@testing-library/
# react-native) prueba comportamiento real con screen.findByText(...) /
# waitFor(...) / getByText(...), que TIRAN si no encuentran el elemento
# (esa es la aserción, igual que expect(...).toBeTruthy() pero vía
# excepción en vez de matcher). Confirmado leyendo varios de los 24 casos
# reportados -- todos verifican comportamiento real, ninguno es un test
# vacío. Se desactiva la regla solo para archivos de test, no para
# producción.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.tsx

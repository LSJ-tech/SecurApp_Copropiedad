name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7" # misma versión que PYTHON_VERSION en render.yaml (producción)

      - name: Instalar dependencias (fijadas por hash)
        run: |
          # requirements-ci-lock.txt fija por hash sha256 cada paquete que este
          # workflow instala (directo + transitivo, incluido coverage) -- pip
          # rechaza instalar cualquier archivo cuyo hash no coincida, aunque el
          # índice de paquetes esté comprometido o alguien resuba la misma
          # versión con contenido distinto. Mismo criterio --only-binary :all:
          # que build.sh en producción (evita ejecutar setup.py de un paquete
          # comprometido); --no-binary http-ece es la única excepción, igual
          # que en build.sh (pywebpush la necesita, solo publica .tar.gz, es
          # puro Python).
          pip install --require-hashes --only-binary :all: --no-binary http-ece -r requirements-ci-lock.txt

      - name: Correr tests con coverage
        run: |
          coverage run manage.py test
          coverage xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app_movil/package-lock.json

      - name: Correr tests de la app móvil con coverage
        # Sin esto, Sonar nunca ve cobertura real de app_movil/ (TS/TSX) --
        # cuenta cada línea nueva como 0% cubierta aunque el suite de Jest
        # (115 tests) la cubra de verdad, hundiendo new_coverage sin que
        # refleje el estado real del código.
        working-directory: app_movil
        run: |
          npm ci
          npx jest --coverage --watchAll=false

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
